name: build-site
# Rebuilds site/ from data/wishlist.public.json whenever the data (or config/content) changes,
# so the daily refresh only has to commit data + the draft post. Cloudflare then deploys main.
on:
  push:
    branches: [main]
    paths:
      - data/wishlist.public.json
      - config.json
      - content/**
      - scripts/build-public.mjs
      - scripts/client.js
      - scripts/hud.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The build script cleans the data for public use and is idempotent when fed the public file.
      - name: Build site from public data
        run: node scripts/build-public.mjs data/wishlist.public.json
      - name: Safety checks
        run: node scripts/check.mjs
      - name: Commit rebuilt files
        run: |
          git config user.name "t7-parts-list-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wishlist.public.json site
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site from data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
